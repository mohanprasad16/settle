[project]
name = "settle"
version = "0.1.0"
description = "Account for every rupee between your books, Razorpay and your bank."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.0",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pypdf[crypto]>=7.1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pypdfium2>=5.15.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
